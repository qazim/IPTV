name: Update EPG

on:
  schedule:
    - cron: "30 2 * * *"   # daily, 02:30 UTC (06:30 Baku)
  workflow_dispatch:        # manual run button

permissions:
  contents: write

concurrency:
  group: epg-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build filtered EPG
        env:
          EPG_URL: ${{ secrets.EPG_URL }}
        run: |
          python make_epg.py --m3u regional.m3u --out "$RUNNER_TEMP/epg_small.xml"
          cp "$RUNNER_TEMP/epg_small.xml.gz" epg_small.xml.gz

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg_small.xml.gz
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update EPG"
            git push
          fi
